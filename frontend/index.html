<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Parser</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash. Defaults to dark.
      try {
        var theme = localStorage.getItem('resume-parser-theme') || 'dark'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <meta name="description" content="AI-powered resume and job description matching" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
