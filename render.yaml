services:
  - type: web
    name: resume-parser-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: GROQ_API_KEY
        sync: false # prompted in the Render dashboard, never committed
      - key: CORS_ORIGINS
        sync: false # e.g. https://resume-parser.vercel.app
